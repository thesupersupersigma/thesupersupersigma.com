<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./styles.css">
    <title>thesupersupersigma.com</title>
    <script type="module" src="./TSSS.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
        <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <link rel="icon" href="/favicon.ico">
    <script type="module" src="./script.js"></script>
</head>
<body>
    <div class="windows7">
        <!-- Desktop Apps: snap to a grid like Win7 (drag to move, double-click to open).
             data-app must match a name in the apps list in script.js. -->
        <div class="desktopIcons" id="desktopIcons">
            <button class="desktopIcon internetExplorerDesktopButton" data-app="internetExplorer">
                <img src="/icons/IE.png" alt="" draggable="false">
                <span class="desktopLabel">Internet Explorer</span>
            </button>
            <button class="desktopIcon mediaPlayerDesktopButton" data-app="mediaPlayer">
                <img src="/icons/mediaPlayer.png" alt="" draggable="false">
                <span class="desktopLabel">Windows Media Player</span>
            </button>
        </div>
        <div class="taskbar">
            <div class="buttons">
                <button id="startMenuButton"></button>
                <button id="internetExplorerButton" class="taskbarApp"></button>
                <button id="mediaPlayerButton" class="taskbarApp"><img src="/icons/mediaPlayer.png" class="taskbarIcon" alt="mediaPlayer Icon"></button>
            </div>
        </div>
        <div id="startMenu">
            <div class="appPanel">
                <ul class="appList">
                    <!-- placeholder apps: change --c for the icon color -->
                    <li><button class="appItem" id="startInternetExplorer"><img class="appIcon" src="/icons/IE.png" alt="internetExplorer icon"><span class="appName">Internet Explorer</span></button></li>
                    <li><button class="appItem" id="startMediaPlayer"><img class="appIcon" src="/icons/mediaPlayer.png" alt="mediaPlayer icon"><span class="appName">Windows Media Player</span></button></li>
                    <!-- <li><button class="appItem" style="--c: #f1c40f"><span class="appIcon"></span><span class="appName">App 3</span></button></li>
                    <li><button class="appItem" style="--c: #2ecc71"><span class="appIcon"></span><span class="appName">App 4</span></button></li>
                    <li><button class="appItem" style="--c: #1abc9c"><span class="appIcon"></span><span class="appName">App 5</span></button></li>
                    <li><button class="appItem" style="--c: #3498db"><span class="appIcon"></span><span class="appName">App 6</span></button></li>
                    <li><button class="appItem" style="--c: #9b59b6"><span class="appIcon"></span><span class="appName">App 7</span></button></li>
                    <li><button class="appItem" style="--c: #e84393"><span class="appIcon"></span><span class="appName">App 8</span></button></li>
                    <li><button class="appItem" style="--c: #8d6e63"><span class="appIcon"></span><span class="appName">App 9</span></button></li>
                    <li><button class="appItem" style="--c: #607d8b"><span class="appIcon"></span><span class="appName">App 10</span></button></li> -->
                </ul>
                <div class="startSearchBar">
                    <div class="searchBox">
                        <input type="text" placeholder="Search programs and files" aria-label="Search programs and files">
                        <svg class="searchIcon" viewBox="0 0 16 16" aria-hidden="true">
                            <circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <line x1="9.8" y1="9.8" x2="14" y2="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
            </div>
            <!-- Right: profile pic + glass links -->
            <div class="userPfpFrame"><img class="userPfp" src="/flower.png" alt="flower pfp"></div>
            <nav class="startRight">
                <a class="rightItem" href="https://github.com/thesupersupersigma">thesupersupersigma</a>
                <a class="rightItem" href="#">Documents</a>
                <a class="rightItem" href="https://media.thesupersupersigma.com/kimBooty.gif">Pictures</a>
                <a class="rightItem" href="#">Music</a>
                <div class="rightSep"></div>
                <a class="rightItem" href="https://rustyac.com">Games</a>
                <a class="rightItem" href="#">Computer</a>
                <div class="rightSep"></div>
                <a class="rightItem" href="#">Control Panel</a>
                <a class="rightItem" href="#">Devices and Printers</a>
                <a class="rightItem" href="#">Default Programs</a>
                <a class="rightItem" href="mailto:thesupersupersigma.com">Help and Support</a>
            </nav>
            <button class="shutdownButton">Shut down</button>
        </div>

        <!-- App windows: script.js creates one iframe per app and adds it here -->
    </div>
</body>
</html>
