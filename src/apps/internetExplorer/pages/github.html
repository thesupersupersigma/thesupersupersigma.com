<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thesupersupersigma</title>
    <style>
        /* Built-in page for IE: GitHub can't be shown in a frame, so this shows the
           same profile + repos using GitHub's public API. */

        :root {
            --text: #1f2328;
            --muted: #59636e;
            --line: #d1d9e0;
            --link: #0969da;
            --bg: #ffffff;
            --soft: #f6f8fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 "Segoe UI", Tahoma, sans-serif;
        }

        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .page {
            display: flex;
            gap: 32px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 24px 40px;
        }

        /* ----- left: profile ----- */

        .profile {
            flex: none;
            width: 260px;
        }

        .avatar {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--soft);
            object-fit: cover;
        }

        .name {
            margin: 16px 0 0;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.25;
        }

        .login {
            margin: 0;
            font-size: 20px;
            font-weight: 300;
            color: var(--muted);
        }

        .bio {
            margin: 14px 0 0;
            white-space: pre-line;
        }

        .openBtn {
            display: block;
            margin-top: 16px;
            padding: 5px 16px;
            text-align: center;
            font-weight: 500;
            color: var(--text);
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .openBtn:hover {
            background: #eef1f4;
            text-decoration: none;
        }

        .meta {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
            color: var(--muted);
        }

        .meta li { margin-top: 4px; }
        .meta strong { color: var(--text); font-weight: 600; }

        /* ----- right: repositories ----- */

        .repos {
            flex: 1;
            min-width: 0;
        }

        .reposHeader {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
            font-size: 16px;
            font-weight: 600;
        }

        .count {
            padding: 0 7px;
            font-size: 12px;
            font-weight: 500;
            background: #e6eaef;
            border-radius: 10px;
        }

        .repo {
            padding: 20px 0;
            border-bottom: 1px solid var(--line);
        }

        .repoTop {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .repoName {
            font-size: 18px;
            font-weight: 600;
            word-break: break-word;
        }

        .badge {
            padding: 0 7px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .desc {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .repoMeta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .lang { display: inline-flex; align-items: center; gap: 4px; }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .message {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .page { flex-direction: column; }
            .profile { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <aside class="profile" id="profile"></aside>
        <main class="repos" id="repos">
            <div class="message">Loading…</div>
        </main>
    </div>

    <script type="module">
        const USER = "thesupersupersigma";

        // colors for the common languages (anything else gets gray)
        const LANG_COLORS = {
            TypeScript: "#3178c6", JavaScript: "#f1e05a", Python: "#3572a5", "C#": "#178600",
            "C++": "#f34b7d", C: "#555555", Rust: "#dea584", HTML: "#e34c26", CSS: "#663399",
            Luau: "#00a2ff", Lua: "#000080", Java: "#b07219", Go: "#00add8", Shell: "#89e051",
            PowerShell: "#012456", Kotlin: "#a97bff", Swift: "#f05138",
        };

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        // links open in a real browser tab, since GitHub can't load inside IE
        function link(href, className, text) {
            const a = el("a", className, text);
            a.href = href;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            return a;
        }

        async function api(path) {
            const res = await fetch("https://api.github.com/" + path, {
                headers: { Accept: "application/vnd.github+json" },
            });
            if (res.status === 403 || res.status === 429) {
                throw new Error("GitHub's hourly limit for this network was reached. Try again in a bit.");
            }
            if (!res.ok) throw new Error("GitHub returned an error (" + res.status + ").");
            return res.json();
        }

        function renderProfile(user) {
            const box = document.getElementById("profile");

            const avatar = el("img", "avatar");
            avatar.src = user.avatar_url;
            avatar.alt = "";
            box.append(avatar);

            if (user.name) box.append(el("h1", "name", user.name));
            box.append(el("p", "login", user.login));
            if (user.bio) box.append(el("p", "bio", user.bio));
            box.append(link(user.html_url, "openBtn", "Open on GitHub"));

            const meta = el("ul", "meta");
            const follow = el("li");
            follow.append(el("strong", "", String(user.followers)), " followers · ", el("strong", "", String(user.following)), " following");
            meta.append(follow);
            if (user.location) meta.append(el("li", "", user.location));
            if (user.blog) {
                const li = el("li");
                const href = /^https?:\/\//.test(user.blog) ? user.blog : "https://" + user.blog;
                li.append(link(href, "", user.blog));
                meta.append(li);
            }
            box.append(meta);

            document.title = user.name ? user.login + " (" + user.name + ")" : user.login;
        }

        function renderRepos(repos) {
            const box = document.getElementById("repos");
            box.replaceChildren();

            const header = el("div", "reposHeader", "Repositories");
            header.append(el("span", "count", String(repos.length)));
            box.append(header);

            if (!repos.length) {
                box.append(el("div", "message", "No public repositories yet."));
                return;
            }

            for (const repo of repos) {
                const item = el("div", "repo");

                const top = el("div", "repoTop");
                top.append(link(repo.html_url, "repoName", repo.name));
                top.append(el("span", "badge", repo.fork ? "Forked" : "Public"));
                if (repo.archived) top.append(el("span", "badge", "Archived"));
                item.append(top);

                if (repo.description) item.append(el("p", "desc", repo.description));

                const meta = el("div", "repoMeta");
                if (repo.language) {
                    const lang = el("span", "lang");
                    const dot = el("span", "dot");
                    dot.style.background = LANG_COLORS[repo.language] || "#8b949e";
                    lang.append(dot, repo.language);
                    meta.append(lang);
                }
                if (repo.stargazers_count) meta.append(el("span", "", "★ " + repo.stargazers_count));
                if (repo.forks_count) meta.append(el("span", "", "⑂ " + repo.forks_count));
                const updated = new Date(repo.pushed_at || repo.updated_at);
                meta.append(el("span", "", "Updated " + updated.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })));
                item.append(meta);

                box.append(item);
            }
        }

        async function main() {
            try {
                const [user, repos] = await Promise.all([
                    api("users/" + USER),
                    api("users/" + USER + "/repos?per_page=100&sort=pushed"),
                ]);
                renderProfile(user);
                renderRepos(repos);
            } catch (err) {
                const box = document.getElementById("repos");
                box.replaceChildren(el("div", "message", err.message));
            }
        }

        main();
    </script>
</body>
</html>
